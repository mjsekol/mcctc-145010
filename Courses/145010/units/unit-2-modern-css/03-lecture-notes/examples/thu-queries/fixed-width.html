<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Club Fair | Fixed width demo</title>
  <!-- The deliberate failure: desktop first, fixed pixel widths. -->
  <style>
    body { margin: 0; font-family: system-ui, "Segoe UI", Arial, sans-serif; line-height: 1.5; color: #1f2937; }
    .page { width: 960px; margin: 0 auto; display: grid; grid-template-columns: 640px 300px; gap: 20px; }
    aside { background-color: #dbeafe; padding: 0 1rem; }
  </style>
</head>
<body>
  <div class="page">
    <main>
      <h1>Club Fair</h1>
      <p>Every club gets one table in the gym. Walk the whole room before you sign anything.</p>
    </main>
    <aside>
      <h2>Volunteer</h2>
      <p>Clubs need two people at each table.</p>
    </aside>
  </div>
</body>
</html>
