<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cafeteria seating map</title>
  <!-- A local stand-in for a third-party map embed. No account, no network. -->
  <style>
    body { margin: 0; font-family: system-ui, "Segoe UI", Arial, sans-serif; background: #f1f5f9; color: #0f172a; }
    main { padding: 0.75rem; }
    h1 { margin: 0 0 0.5rem; font-size: 1rem; }
    ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.5rem; grid-template-columns: repeat(auto-fit, minmax(min(8rem, 100%), 1fr)); }
    li { background: #ffffff; border: 1px solid #94a3b8; border-radius: 0.3rem; padding: 0.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Cafeteria seating, lunch B</h1>
    <ol>
      <li>Tables 1 to 4: juniors</li>
      <li>Tables 5 to 8: seniors</li>
      <li>Tables 9 and 10: clubs</li>
      <li>Salad bar: back wall</li>
    </ol>
  </main>
</body>
</html>
