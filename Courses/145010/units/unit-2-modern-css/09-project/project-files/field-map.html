<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field map | Cedar Hollow Park</title>
  <!--
    A local stand-in for the park district's map embed. The league would paste an
    embed snippet from that service. This file lets you build and test the embed
    with no account and no network.
  -->
  <style>
    body { margin: 0; font-family: system-ui, "Segoe UI", Arial, sans-serif; background: #eaf3ec; color: #10261a; }
    main { padding: 0.75rem; }
    h1 { margin: 0 0 0.5rem; font-size: 1rem; }
    ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.5rem; grid-template-columns: repeat(auto-fit, minmax(min(10rem, 100%), 1fr)); }
    li { background: #ffffff; border: 2px solid #1d5c2e; border-radius: 0.3rem; padding: 0.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Cedar Hollow Park, 400 Orchard Road</h1>
    <ol>
      <li>North lot: park here</li>
      <li>Field A: past the flagpole</li>
      <li>Pavilion with the green roof</li>
      <li>Field B: behind the pavilion, by the batting cages</li>
      <li>South lot: pool parking only, ticketed</li>
    </ol>
  </main>
</body>
</html>
