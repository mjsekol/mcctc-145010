<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Floor map | Pine Ridge Community Center</title>
  <style>
    body { margin: 0; font-family: system-ui, "Segoe UI", Arial, sans-serif; background: #eef4ef; color: #13261b; }
    main { padding: 0.75rem; }
    h1 { margin: 0 0 0.5rem; font-size: 1rem; }
    .hall { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(9rem, 100%), 1fr)); gap: 0.5rem; margin: 0; padding: 0; list-style: none; }
    .hall li { background: #ffffff; border: 2px solid #1f6f43; border-radius: 0.3rem; padding: 0.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Main hall floor map</h1>
    <ul class="hall">
      <li>Entrance and check-in</li>
      <li>Tables 1 to 6: robotics and electronics</li>
      <li>Tables 7 to 12: art, textiles, and 3D printing</li>
      <li>Workshop rooms A and B: back hallway</li>
      <li>Water and first aid: next to the stage</li>
    </ul>
  </main>
</body>
</html>
