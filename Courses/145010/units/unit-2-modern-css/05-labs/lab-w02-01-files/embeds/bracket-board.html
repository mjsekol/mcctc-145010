<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bracket board | Eastgate spring bracket</title>
  <!--
    This page stands in for a third-party bracket service. A real club would paste
    an embed snippet from that service. Here it is a local file, so the lab works
    with no account and no network, and you control everything inside the frame.
  -->
  <style>
    body { margin: 0; padding: 0.75rem; font-family: system-ui, "Segoe UI", Arial, sans-serif; background: #1f1438; color: #ffffff; }
    h1 { margin: 0 0 0.5rem; font-size: 1.1rem; }
    ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.4rem; grid-template-columns: repeat(auto-fit, minmax(min(12rem, 100%), 1fr)); }
    li { background: #3a2470; border-radius: 0.4rem; padding: 0.4rem 0.6rem; }
    .status { display: block; font-size: 0.85rem; color: #d9f5f1; }
  </style>
</head>
<body>
  <main>
    <h1>Round 1 board</h1>
    <ol>
      <li>Static Owls vs Tuesday Club <span class="status">Match 1, not started</span></li>
      <li>Byte Night vs Lag Wizards <span class="status">Match 2, not started</span></li>
      <li>Neon Moose vs Glass Cannons <span class="status">Match 3, not started</span></li>
      <li>Pixel Ferns vs Quiet Thunder <span class="status">Match 4, not started</span></li>
    </ol>
  </main>
</body>
</html>
