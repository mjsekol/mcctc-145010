<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parts Checkout · Ridgeview Robotics Club</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; color: #1a1a1a; background: #ffffff; line-height: 1.5; }
    header { padding: 14px 20px; background: #123c6b; color: #ffffff; }
    header .org { margin: 0; font-size: 1.25rem; font-weight: bold; }
    main { max-width: 900px; margin: 0 auto; padding: 20px; }
    h1, h2 { color: #123c6b; }
    .due-banner { padding: 10px 14px; background: #eaf1fb; border-left: 6px solid #123c6b; font-weight: bold; }
    .controls { display: flex; flex-wrap: wrap; gap: 20px; margin: 16px 0; }
    .add-form { display: grid; gap: 10px; min-width: 260px; }
    .field { display: grid; gap: 4px; }
    label { font-weight: bold; }
    input { width: 100%; font: inherit; padding: 8px; border: 1px solid #6b6b6b; border-radius: 6px; }
    button { justify-self: start; font: inherit; font-weight: bold; padding: 10px 18px; border: 0; border-radius: 6px; background: #123c6b; color: #ffffff; cursor: pointer; }
    .filter-box { min-width: 260px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    caption { text-align: left; padding-bottom: 6px; }
    th, td { padding: 8px; text-align: left; border-bottom: 1px solid #c8c8c8; }
    thead th { background: #eaf1fb; }
    footer { margin-top: 32px; padding: 14px 20px; background: #eaf1fb; }
  </style>
</head>
<body>
  <header>
    <p class="org">Ridgeview Robotics Club</p>
  </header>
  <main>
    <h1>Parts checkout</h1>
    <p class="due-banner">Parts due back within 7 days: <span id="due-soon">0</span></p>

    <div class="controls">
      <form class="add-form" id="add-form">
        <h2>Check out a part</h2>
        <div class="field">
          <label for="part">Part</label>
          <input type="text" id="part" name="part" maxlength="60" required>
        </div>
        <div class="field">
          <label for="note">Note</label>
          <input type="text" id="note" name="note" maxlength="120">
        </div>
        <button type="submit">Add checkout</button>
      </form>

      <div class="filter-box">
        <h2>Filter</h2>
        <input type="text" id="filter">
      </div>
    </div>

    <section class="table-wrap" tabindex="0" aria-label="Parts currently checked out">
      <table>
        <caption>Parts currently checked out</caption>
        <thead>
          <tr>
            <th scope="col">Part</th>
            <th scope="col">Member</th>
            <th scope="col">Note</th>
            <th scope="col">Due back</th>
          </tr>
        </thead>
        <tbody id="checkout-body"></tbody>
      </table>
    </section>
  </main>
  <footer>
    <p>Return parts to the robotics room cabinet. Questions go to the club officers.</p>
  </footer>

  <script src="parts-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
